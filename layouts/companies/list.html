<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,follow">
  <title>{{ .Title }}</title>
  {{ $home := .Site.Home.RelPermalink }}
  <link rel="canonical" href="{{ .Site.Home.Permalink }}">
  <script>
    // The company list now lives on the home page. Redirect while keeping
    // any ?industry= / #hash so filter links continue to work.
    location.replace({{ $home | jsonify }} + location.search + location.hash);
  </script>
  <meta http-equiv="refresh" content="0; url={{ $home }}">
</head>
<body>
  <p>Redirecting to <a href="{{ $home }}">the portfolio</a>…</p>
</body>
</html>
